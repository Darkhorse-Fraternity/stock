[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-recommender"
version = "0.1.0"
description = "A-share stock recommendation pipeline with market data fallback and LLM reporting."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tick = ["akshare"]
analysis = ["akshare>=1.18.64"]
integration = ["psycopg[binary]>=3.2"]

[project.scripts]
stock-agent = "stock_recommender.cli:main"
stock-agent-admin = "stock_recommender.admin:main"
stock-backtest-data = "stock_recommender.historical_data_cli:main"
stock-portfolio-migrate = "stock_recommender.portfolio_migration_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_recommender = ["web/*.html", "web/*.css", "web/*.js"]
