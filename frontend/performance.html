<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>策略表现 · Stock Agent</title>
  <style>
    :root {
      --ink: #10243e;
      --muted: #66768a;
      --line: #c8d4df;
      --paper: #f7fafc;
      --blue: #2866ae;
      --red: #c83e4c;
      --green: #16805f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "PingFang SC", monospace;
      background-color: #edf3f7;
      background-image: linear-gradient(#57789512 1px, transparent 1px), linear-gradient(90deg, #57789512 1px, transparent 1px);
      background-size: 24px 24px;
    }
    main { width: min(1180px, calc(100% - 32px)); margin: 28px auto 56px; background: white; border: 1px solid var(--line); box-shadow: 0 18px 55px #10243e18; }
    header { display: flex; justify-content: space-between; gap: 24px; padding: 26px 28px; border-bottom: 4px solid var(--ink); }
    h1, h2 { font-family: Georgia, "Noto Serif SC", serif; }
    h1 { margin: 6px 0 3px; font-size: clamp(26px, 3vw, 40px); overflow-wrap: anywhere; }
    h2 { margin: 8px 0; font-size: 24px; }
    .eyebrow { color: var(--blue); font-size: 12px; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; }
    .sub, .tiny { color: var(--muted); overflow-wrap: anywhere; }
    .tiny { display: block; font-size: 11px; }
    .badge, .side { display: inline-block; height: max-content; padding: 4px 8px; border: 1px solid var(--line); background: #edf3f8; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
    .metric { min-width: 0; min-height: 118px; padding: 22px 24px; border-right: 1px solid var(--line); }
    .metric:last-child { border-right: 0; }
    .metric label, .risk-cell label { display: block; color: var(--muted); font-size: 12px; }
    .metric strong { display: block; margin-top: 8px; font: 700 clamp(21px, 2.2vw, 30px) Georgia, serif; overflow-wrap: anywhere; }
    .risk-ledger { display: grid; grid-template-columns: 220px repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); background: #fbfdfe; }
    .risk-copy { grid-row: span 2; padding: 22px 24px; color: white; background: var(--ink); }
    .risk-copy .eyebrow { color: #91bee9; }
    .risk-cell { min-width: 0; padding: 17px 18px; border-left: 1px solid var(--line); }
    .risk-cell strong { display: block; margin-top: 5px; font-size: 19px; overflow-wrap: anywhere; }
    .runtime { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; padding: 16px 28px; border-bottom: 1px solid var(--line); background: #f8fbfd; }
    .runtime-detail { color: var(--muted); overflow-wrap: anywhere; }
    .chart-area { display: grid; grid-template-columns: 290px minmax(0, 1fr); border-bottom: 1px solid var(--line); }
    .chart-copy { padding: 22px 24px; border-right: 1px solid var(--line); background: #fbfdfe; }
    .chart-copy p, .risk-copy p { color: inherit; font-size: 12px; }
    .chart { min-width: 0; padding: 18px 22px; }
    .chart svg { display: block; width: 100%; height: auto; max-height: 220px; }
    .quote-error { margin-top: 8px; padding: 8px 10px; color: #8f2834; border-left: 3px solid var(--red); background: #fff1f2; overflow-wrap: anywhere; }
    .tabs { display: flex; gap: 4px; padding: 16px 22px; overflow-x: auto; border-bottom: 1px solid var(--line); background: var(--paper); }
    [role="tab"] { flex: 0 0 auto; padding: 9px 13px; border: 0; color: var(--muted); font: inherit; white-space: nowrap; cursor: pointer; background: transparent; }
    [role="tab"][aria-selected="true"] { color: white; background: var(--ink); }
    [role="tab"]:focus-visible { outline: 3px solid #6fa8dc; outline-offset: 2px; }
    [role="tabpanel"] { min-width: 0; }
    .table-wrap { max-width: 100%; overflow-x: auto; overscroll-behavior-inline: contain; }
    table { width: 100%; min-width: 720px; border-collapse: collapse; }
    th, td { padding: 14px 16px; border-bottom: 1px solid #dde5eb; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: 12px; background: #fbfdfe; }
    td strong, .event strong { overflow-wrap: anywhere; }
    .side { margin-left: 6px; font-size: 10px; font-weight: 800; }
    .side.long { color: var(--red); border-color: #efb8bf; background: #fff1f2; }
    .side.short { color: var(--green); border-color: #a8d5c6; background: #eaf7f2; }
    .events { padding: 0 22px; }
    .event { display: grid; grid-template-columns: 175px 170px minmax(0, 1fr); gap: 18px; padding: 15px 0; border-bottom: 1px solid #dde5eb; }
    .event.risk { border-left: 3px solid var(--red); padding-left: 12px; }
    .event.highlight { background: #fff4d6; outline: 2px solid #d69a16; outline-offset: -2px; }
    .event-data { max-width: 100%; margin: 8px 0 0; padding: 8px; overflow: auto; color: var(--muted); font: 11px/1.45 inherit; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--paper); }
    .type { color: var(--blue); font-weight: 700; }
    .up { color: var(--red); }
    .down { color: var(--green); }
    footer { display: flex; justify-content: space-between; gap: 18px; padding: 18px 22px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); }
    .empty, .loading, .error { padding: 70px 24px; color: var(--muted); text-align: center; overflow-wrap: anywhere; }
    .error { color: var(--red); }
    @media (max-width: 760px) {
      main { width: 100%; margin: 0; }
      header { flex-direction: column; }
      .metrics { grid-template-columns: 1fr 1fr; }
      .runtime { grid-template-columns: 1fr; }
      .chart-area { grid-template-columns: 1fr; }
      .chart-copy { border-right: 0; border-bottom: 1px solid var(--line); }
      .metric { padding: 20px 16px; }
      .metric:nth-child(2) { border-right: 0; }
      .risk-ledger { grid-template-columns: 1fr 1fr; }
      .risk-copy { grid-column: 1 / -1; grid-row: auto; }
      .risk-cell { border-bottom: 1px solid var(--line); border-left: 0; }
      .risk-cell:nth-child(odd) { border-left: 1px solid var(--line); }
      .risk-cell strong { white-space: normal; overflow-wrap: anywhere; }
      .event { grid-template-columns: 1fr; gap: 3px; }
      footer { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main id="app"><div class="loading">正在载入策略账本……</div></main>
  <script type="module" src="/src/performance-entry.ts"></script>
</body>
</html>
