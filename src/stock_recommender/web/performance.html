<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>策略表现 · Stock Agent</title>
  <style>
    :root{--ink:#10243e;--muted:#66768a;--line:#c8d4df;--paper:#f7fafc;--blue:#2866ae;--red:#c83e4c;--green:#16805f}
    *{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;color:var(--ink);font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"PingFang SC",monospace;background:#edf3f7;background-image:linear-gradient(#57789512 1px,transparent 1px),linear-gradient(90deg,#57789512 1px,transparent 1px);background-size:24px 24px}
    main{width:min(1180px,calc(100% - 32px));margin:28px auto 56px;background:white;border:1px solid var(--line);box-shadow:0 18px 55px #10243e18}header{display:flex;justify-content:space-between;gap:24px;padding:26px 28px;border-bottom:4px solid var(--ink)}
    .eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}h1,h2{font-family:Georgia,"Noto Serif SC",serif}h1{margin:6px 0 3px;font-size:clamp(26px,3vw,40px)}h2{margin:8px 0;font-size:24px}.sub,.tiny{color:var(--muted)}.tiny{font-size:11px}.badge,.pill{display:inline-block;padding:4px 8px;background:#edf3f8}.badge{height:max-content;border:1px solid var(--line)}
    .runtime{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:16px 28px;border-bottom:1px solid var(--line);background:#f8fbfd}.runtime strong{display:block}.runtime-detail{color:var(--muted);overflow-wrap:anywhere}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}.metric{min-width:0;padding:22px 24px;min-height:132px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric label{color:var(--muted);font-size:12px}.metric strong{display:block;margin:8px 0;font:700 clamp(22px,2.2vw,30px) Georgia,serif;white-space:nowrap;letter-spacing:-.025em}.up{color:var(--red)}.down{color:var(--green)}
    .risk-ledger{display:grid;grid-template-columns:220px repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line);background:#fbfdfe}.risk-copy{grid-row:span 2;padding:22px 24px;background:var(--ink);color:white}.risk-copy .eyebrow{color:#91bee9}.risk-copy h2{font-size:21px}.risk-copy p{color:#b9c8d6;font-size:12px}.risk-cell{min-width:0;padding:17px 18px;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}.risk-cell:nth-last-child(-n+4){border-bottom:0}.risk-cell label{display:block;color:var(--muted);font-size:11px}.risk-cell strong{display:block;margin:5px 0 3px;font:700 19px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}.risk-rule{height:3px;margin-top:9px;background:#dfe8ef}.risk-rule span{display:block;height:100%;background:var(--blue)}
    .chart-area{display:grid;grid-template-columns:240px 1fr;border-bottom:1px solid var(--line)}.chart-copy{padding:28px;border-right:1px solid var(--line)}.chart-copy p{color:var(--muted)}.chart{padding:24px}.chart svg{width:100%;height:210px;overflow:visible}
    .tabs{display:flex;gap:4px;padding:16px 22px;background:var(--paper);border-bottom:1px solid var(--line)}button{font:inherit}.tab{border:0;background:transparent;color:var(--muted);padding:9px 13px;cursor:pointer}.tab.active{color:white;background:var(--ink)}.updated{margin-left:auto;align-self:center;color:var(--muted);font-size:12px}
    .section{display:none}.section.active{display:block}.table-wrap{max-width:100%;overflow-x:auto}table{width:100%;min-width:1040px;border-collapse:collapse}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid #dde5eb;vertical-align:top}th{color:var(--muted);font-size:12px;background:#fbfdfe}td strong{font-family:ui-sans-serif,system-ui,"PingFang SC",sans-serif}.pill.up{background:#fae9eb}.pill.down{background:#e6f3ee}.side{display:inline-block;margin-left:6px;padding:2px 6px;border:1px solid;font-size:10px;font-weight:800;letter-spacing:.08em}.side.long{color:var(--red);background:#fff1f2;border-color:#efb8bf}.side.short{color:var(--green);background:#eaf7f2;border-color:#a8d5c6}.empty,.loading,.error{padding:70px 24px;text-align:center;color:var(--muted)}.error{color:var(--red)}
    .events{padding:0 22px}.event{display:grid;grid-template-columns:175px 170px 1fr;gap:18px;padding:15px 0;border-bottom:1px solid #dde5eb}.event.highlight{margin:0 -12px;padding:15px 12px;background:#fff3d2;outline:1px solid #e0b957}.event.risk{margin:0 -12px;padding:15px 12px;border-left:4px solid #d69c28;background:#fffbeb}.type{font-weight:700;color:var(--blue)}.event.risk .type{color:#9a6700}footer{display:flex;justify-content:space-between;gap:16px;padding:18px 24px;background:var(--paper);color:var(--muted);font-size:12px}button:focus-visible,a:focus-visible{outline:3px solid #6fa8dc;outline-offset:3px}
    @media(max-width:760px){main{width:100%;margin:0;overflow:hidden}header{flex-direction:column}.runtime{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.metric{padding:20px 16px}.metric strong{font-size:clamp(19px,5.5vw,24px);white-space:nowrap}.metric:nth-child(2){border-right:0}.risk-ledger{grid-template-columns:1fr 1fr}.risk-copy{grid-column:1/-1;grid-row:auto}.risk-cell{border-left:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.risk-cell:nth-last-child(-n+4){border-bottom:1px solid var(--line)}.risk-cell:nth-child(odd){border-right:0}.chart-area{grid-template-columns:1fr}.chart-copy{border-right:0;border-bottom:1px solid var(--line)}.updated{display:none}.event{grid-template-columns:1fr;gap:3px}.tabs{overflow-x:auto}.tab{white-space:nowrap}footer{flex-direction:column}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body><main id="app"><div class="loading">正在载入策略账本……</div></main>
<script>
const app=document.getElementById('app'),query=new URLSearchParams(location.search),parts=location.pathname.split('/').filter(Boolean);
const strategyId=parts.length===3&&parts[0]==='strategies'&&parts[2]==='portfolio'?decodeURIComponent(parts[1]):'',highlight=query.get('event')||'';
let currencySymbol='¥';const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),n=v=>Number(v||0),money=v=>`${currencySymbol}${n(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}`,pct=v=>`${n(v)>=0?'+':''}${n(v).toFixed(2)}%`,tone=v=>n(v)>0?'up':n(v)<0?'down':'',dateTime=v=>String(v||'—').replace('T',' ').replace(/([+-]\d{2}:\d{2}|Z)$/,'');
const text={NORMAL:'正常',WARNING:'回撤预警',DE_RISKING:'强制降仓',BREACHED:'人工暂停',RUNNING:'运行中',ENTRY_BLOCKED:'禁止开仓',EXIT_ONLY:'只减仓',COVER_ONLY:'仅允许回补',MARGIN_CALL:'保证金追缴',RISK_CHANGED:'风险状态变化',FINANCING_COST_ACCRUED:'融资成本计提',BORROW_COST_ACCRUED:'借券成本计提',MANUAL_HALT:'已暂停',INTENDED:'待成交',PARTIAL:'部分成交',FILLED:'已成交',CANCELLED:'已取消',LONG:'多头',SHORT:'空头',LONG_ONLY:'只做多',LONG_LEVERAGED:'杠杆做多',LONG_SHORT:'多空组合',strategy_estimate:'策略估算',unavailable:'不可用',market_regime:'市场状态',absolute_momentum:'绝对动量'};const tr=v=>text[v]||v||'—';
function metric(label,value,detail,klass=''){return `<div class="metric"><label>${esc(label)}</label><strong class="${klass}">${esc(value)}</strong><small class="tiny">${esc(detail)}</small></div>`}
function riskMetric(label,value,detail,ratio=0){return `<div class="risk-cell"><label>${esc(label)}</label><strong>${esc(value)}</strong><small class="tiny">${esc(detail)}</small><div class="risk-rule"><span style="width:${Math.max(0,Math.min(n(ratio),100))}%"></span></div></div>`}
function navChart(rows){if(!rows.length)return '<div class="empty">尚无净值记录</div>';const values=rows.map(x=>n(x.nav)),lo=Math.min(...values),hi=Math.max(...values),span=Math.max(hi-lo,1),w=800,h=180,p=18,pts=values.map((v,i)=>[p+(w-p*2)*(rows.length===1?.5:i/(rows.length-1)),p+(h-p*2)*(1-(v-lo)/span)]),line=pts.map(x=>x.join(',')).join(' '),area=`${p},${h-p} ${line} ${w-p},${h-p}`;return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="策略净值曲线"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#b9c8d6" stroke-dasharray="5 5"/><polygon points="${area}" fill="#2866ae18"/><polyline points="${line}" fill="none" stroke="#2866ae" stroke-width="3"/>${pts.map((x,i)=>`<circle cx="${x[0]}" cy="${x[1]}" r="${i===pts.length-1?5:3}" fill="#c83e4c"><title>${esc(rows[i].at)} · ${money(rows[i].nav)}</title></circle>`).join('')}<text x="${p}" y="12" fill="#66768a" font-size="11">${money(hi)}</text><text x="${p}" y="${h}" fill="#66768a" font-size="11">${money(lo)}</text></svg>`}
function borrow(position){if(position.side!=='SHORT')return '无需借券';const rate=position.borrow_rate_pct==null?'费率不可用':`借券年化 ${n(position.borrow_rate_pct).toFixed(2)}%`;const source=position.borrow_rate_estimated?'策略估算':tr(position.borrow_rate_source);return `${rate} · ${source}`}
function positions(rows){if(!rows.length)return '<div class="empty">当前空仓，等待符合策略条件的入场信号。</div>';return `<div class="table-wrap"><table><thead><tr><th>槽位 / 股票</th><th>首次成交</th><th>当前价</th><th>持仓收益</th><th>仓位 / 保证金</th><th>数量 / 可卖</th><th>风控 / 借券</th><th>退出距离</th></tr></thead><tbody>${rows.map(position=>`<tr><td><strong>#${esc(position.slot_id)} ${esc(position.name)}</strong><span class="side ${position.side==='SHORT'?'short':'long'}">${esc(tr(position.side))}</span><div class="tiny">${esc(position.symbol)} · ${esc(tr(position.position_mode))}</div></td><td>${position.first_entry_price==null?'—':money(position.first_entry_price)}<div class="tiny">${esc(position.first_entry_at)}</div></td><td>${money(position.current_price)}<div class="tiny">当日 ${position.day_change_pct==null?'—':pct(position.day_change_pct)}</div></td><td><span class="pill ${tone(position.return_pct)}">${pct(position.return_pct)}</span><div class="tiny">${money(position.unrealized_pnl)}</div></td><td>${n(position.weight_pct).toFixed(1)}%<div class="tiny">占用 ${money(position.margin_used)}</div></td><td>${esc(position.quantity)} / ${esc(position.sellable_quantity??'—')}</td><td>${position.trailing_active?'追踪退出已激活':'常规监控'}<div class="tiny">${esc(borrow(position))}</div></td><td>${position.exit_distance_pct==null?'—':pct(position.exit_distance_pct)}</td></tr>`).join('')}</tbody></table></div>`}
function orders(rows){if(!rows.length)return '<div class="empty">暂无订单记录。</div>';return `<div class="table-wrap"><table><thead><tr><th>时间</th><th>方向 / 股票</th><th>状态</th><th>原因</th><th>成交数量</th><th>成交金额</th><th>费用</th><th>版本</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.updated_at||r.created_at)}</td><td><strong>${esc(r.side)} ${esc(r.name)}</strong><div class="tiny">${esc(r.symbol)}</div></td><td><span class="pill">${esc(tr(r.status))}</span></td><td>${esc(r.reason)}</td><td>${esc(r.filled_quantity||0)} / ${esc(r.quantity)}</td><td>${money(r.filled_notional)}</td><td>${money(r.commission_charged)}</td><td>v${esc(r.strategy_revision)}</td></tr>`).join('')}</tbody></table></div>`}
function trades(rows){if(!rows.length)return '<div class="empty">尚无已退出持仓。</div>';return `<div class="table-wrap"><table><thead><tr><th>股票</th><th>入场 / 退出</th><th>数量</th><th>净收益</th><th>收益率</th><th>退出原因</th><th>版本</th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${esc(r.name)}</strong><div class="tiny">${esc(r.symbol)}</div></td><td>${money(r.entry_price)} → ${money(r.exit_price)}<div class="tiny">${esc(r.closed_at)}</div></td><td>${esc(r.quantity)}</td><td class="${tone(r.realized_pnl)}">${money(r.realized_pnl)}</td><td class="${tone(r.return_pct)}">${pct(r.return_pct)}</td><td>${esc(r.reason)}</td><td>v${esc(r.strategy_revision)}</td></tr>`).join('')}</tbody></table></div>`}
function events(rows){if(!rows.length)return '<div class="empty">暂无策略事件。</div>';const riskTypes=new Set(['MARGIN_CALL','COVER_ONLY','RISK_CHANGED']);return `<div class="events">${rows.map(r=>`<article id="event-${esc(r.id)}" class="event ${riskTypes.has(r.type)?'risk':''} ${r.id===highlight?'highlight':''}"><time>${esc(r.occurred_at)}</time><div class="type">${esc(tr(r.type))}<div class="tiny">${esc(r.type)}</div></div><div><strong>${esc(r.message)}</strong><div class="tiny">策略版本 v${esc(r.strategy_revision??'—')} · ${esc(r.id)}</div></div></article>`).join('')}</div>`}
function stageDiagnostics(rows){return rows.map(row=>{const values=row.diagnostics?.[0]||{};return `${tr(row.stage)}: ${Object.entries(values).map(([key,value])=>`${key}=${value}`).join(', ')}`}).join(' · ')}
function qualityDiagnostics(q){if(!q||!Object.keys(q).length)return '暂无数据覆盖诊断';return `股票池 ${n(q.raw_count)} → 实时行情 ${n(q.quote_count??q.raw_count)} → 基础过滤 ${n(q.basic_count)} → 历史特征 ${n(q.history_ready_count)} → 策略过滤 ${n(q.strategy_filtered_count)} → 动量准入 ${n(q.absolute_momentum_count)} → 最终 ${n(q.selected_count)} · ${q.status==='READY'?'可运行':'已阻断'} · ${q.source_mode||'未知数据源'}`}
function render(d){currencySymbol=d.currency_symbol||d.strategy?.currency_symbol||'¥';const s=d.strategy||{},m=d.summary||{},r=d.runtime||{},regime=s.market_regime||{},quality=r.last_pipeline_data_quality||{},costNote=d.market==='us'||s.market==='us'?'美股模拟盘按整股、免佣口径，已计滑点、融资与借券估算成本。':'A 股模拟盘收益已计佣金、印花税、过户费与滑点。',gross=n(m.gross_exposure_pct),net=n(m.net_exposure_pct),longShare=m.nav?n(m.long_market_value)/n(m.nav)*100:0;document.title=`${s.name||'策略'}表现 · Stock Agent`;app.innerHTML=`<header><div><div class="eyebrow">Strategy Portfolio Ledger</div><h1>${esc(s.name||'策略表现')}</h1><div class="sub">${esc(d.market_label||s.market_label||'A股')} · 策略 ID ${esc(s.id)} · 版本 v${esc(s.revision)} · ${esc(s.stage)} · 基准 ${esc(s.benchmark_name)}</div></div><div class="badge">${esc(tr(s.exposure_policy?.mode))} · ${esc(tr(s.risk_level))} / ${esc(tr(s.trading_mode))}</div></header><section class="runtime"><div><div class="eyebrow">Pipeline Runtime</div><strong>${r.last_successful_pipeline_at?`最后成功：${esc(dateTime(r.last_successful_pipeline_at))}`:'尚无成功运行'}</strong><div class="tiny">Run ${esc(r.last_successful_pipeline_run_id||'—')}</div></div><div class="runtime-detail">市场状态 ${esc(regime.label||regime.state||'—')}（${esc(regime.state||'—')}） · 目标仓位 ${n(regime.target_exposure_pct).toFixed(0)}% · 本次准入 ${esc(r.last_pipeline_admitted||0)} 只<br><span class="tiny">${esc(qualityDiagnostics(quality))}<br>${esc(stageDiagnostics(r.last_pipeline_stages||[])||'暂无 Pipeline 诊断')}</span></div></section><section class="metrics">${metric('策略累计收益',pct(m.cumulative_return_pct),`初始资金 ${money(m.initial_cash)}`,tone(m.cumulative_return_pct))}${metric('当前净值',money(m.nav),`现金 ${money(m.cash)}`)}${metric('最大回撤',m.maximum_drawdown_pct==null?'—':`${n(m.maximum_drawdown_pct).toFixed(2)}%`,`人工暂停线 ${n(d.config?.halt_drawdown_pct).toFixed(0)}%`,m.maximum_drawdown_pct>=12?'down':'')}${metric('退出胜率',m.win_rate_pct==null?'—':`${n(m.win_rate_pct).toFixed(1)}%`,`${m.closed_trade_count||0} 笔退出 · ${m.position_count||0}/${m.max_positions||10} 持仓`)}</section><section class="risk-ledger"><div class="risk-copy"><div class="eyebrow">Exposure Tape</div><h2>风险敞口台账</h2><p>多头资产、空头负债、保证金与持有成本使用同一估值快照。</p></div>${riskMetric('多头市值',money(m.long_market_value),`占净值 ${longShare.toFixed(1)}%`,longShare)}${riskMetric('空头负债',money(m.short_liability),`SHORT liability`,m.nav?n(m.short_liability)/n(m.nav)*100:0)}${riskMetric('总敞口',m.gross_exposure_pct==null?'—':`${gross.toFixed(2)}%`,`系统上限 ${n(s.exposure_policy?.max_gross_exposure_pct).toFixed(0)}%`,gross/1.5)}${riskMetric('净敞口',m.net_exposure_pct==null?'—':`${net.toFixed(2)}%`,`多头减空头`,Math.abs(net)/1.2)}${riskMetric('保证金率',m.margin_rate_pct==null?'—':`${n(m.margin_rate_pct).toFixed(2)}%`,`保证金占用 ${money(m.margin_loan)}`,m.margin_rate_pct)}${riskMetric('可用购买力',money(m.buying_power),`现金预留 ${money(m.reserved_cash)}`,m.nav?n(m.buying_power)/n(m.nav)*100:0)}${riskMetric('累计融资成本',money(m.financing_cost),`融资余额 ${money(m.margin_loan)}`,m.initial_cash?n(m.financing_cost)/n(m.initial_cash)*100:0)}${riskMetric('累计借券成本',money(m.borrow_cost),`空头成本按来源标注`,m.initial_cash?n(m.borrow_cost)/n(m.initial_cash)*100:0)}</section><section class="chart-area"><div class="chart-copy"><div class="eyebrow">Portfolio NAV</div><h2>策略净值轨迹</h2><p>从模拟账户启用起累计，不再限定 30 天。订单按下一可执行行情并计入交易成本。</p></div><div class="chart">${navChart(d.nav_history||[])}<div class="tiny">更新：${esc(d.generated_at)}${d.quote_error?` · 行情：${esc(d.quote_error)}`:''}</div></div></section><nav class="tabs" aria-label="策略账本视图"><button class="tab active" data-tab="positions">当前持仓</button><button class="tab" data-tab="orders">订单</button><button class="tab" data-tab="trades">退出记录</button><button class="tab" data-tab="events">事件账本</button><span class="updated">策略 v${esc(s.revision)} · 最多 ${esc(m.max_positions||10)} 只</span></nav><section id="positions" class="section active">${positions(d.positions||[])}</section><section id="orders" class="section">${orders(d.orders||[])}</section><section id="trades" class="section">${trades(d.closed_trades||[])}</section><section id="events" class="section">${events(d.events||[])}</section><footer><span>${esc(costNote)}</span><span>仅用于策略验证，不构成投资建议。</span></footer>`;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});if(highlight){document.querySelector('[data-tab="events"]').click();requestAnimationFrame(()=>document.getElementById(`event-${CSS.escape(highlight)}`)?.scrollIntoView({block:'center'}))}}
if(!strategyId){app.innerHTML='<div class="error"><strong>策略表现加载失败</strong><br>URL 缺少策略 ID</div>'}else{fetch(`/api/strategies/${encodeURIComponent(strategyId)}/portfolio`,{headers:{Accept:'application/json'}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}).then(render).catch(e=>app.innerHTML=`<div class="error"><strong>策略表现加载失败</strong><br>${esc(e.message)}</div>`)}
</script></body></html>
